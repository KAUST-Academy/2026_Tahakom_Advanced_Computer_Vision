# =============================================================================
# Advanced Computer Vision — course content
# Phase 2A of the Tahakom AI Early Careers Program (the computer vision track).
#
# This file is the single source of truth for the website. Edit it, run
# `python3 build.py --check`, and every page is regenerated. Never edit the
# generated HTML in _site/ — it is deleted and rebuilt every time.
#
# Resource `status`:
#   todo   -> renders greyed out as "Coming soon", not linked, not checked.
#   ready  -> renders as a button; `file` must exist or --check fails the build.
#
# Material comes from Tahakom_Early_Careers/Phase_2A_Advanced_Computer_Vision,
# day for day and with the same file names: its Day_NN_<Title>/Lectures/ is
# Slides/Day_N/ here, its Labs/ is Labs/Day_N/, and its Optional/ material is in
# an Optional/ subfolder of each. README.md has the details.
# =============================================================================

[course]
title      = "Advanced Computer Vision"
title_lead = "Advanced"
title_rest = "Computer Vision"

tagline  = "Phase 2A of the Tahakom AI Early Careers Program, at Oxford from 12 to 23 October 2026: ten days from modern backbones to foundation models, generative vision and 3D."
client   = "Tahakom"
provider = "KAUST Academy"
year     = "2026"

starts   = "2026-10-12"
ends     = "2026-10-23"
location = "Oxford"

# Drives the footer licence link and the Colab URL pattern below.
repo         = "KAUST-Academy/2026_Tahakom_Advanced_Computer_Vision"

license      = "GPL-3.0"
license_note = "Recording and uploading lectures online is not permitted."

summary = """
The computer vision track of the AI Early Careers Program. It starts with the
backbones and self-supervised pretraining everything else builds on, covers
detection, segmentation and the generative families from VAEs to diffusion, then
foundation models, vision-language models and open-world recognition, and closes
with image restoration, real-world applications and 3D vision.
"""

# -----------------------------------------------------------------------------
# Weeks
#
# Two UK teaching weeks, Monday to Friday. Each [[weeks]] block becomes a
# dropdown in the nav and a section on the home page; a day joins a week with
# `week = N` (1-based, in the order below). Delete every [[weeks]] block to get
# the template's flat nav and single schedule back.
# -----------------------------------------------------------------------------

[[weeks]]
label = "Week 1"
title = "Backbones, Self-Supervision and Generative Models"
blurb = "Monday 12 to Friday 16 October. CNNs and Vision Transformers, self-supervised and JEPA pretraining, detection and segmentation, then autoencoders, VAEs, normalizing flows and GANs."

[[weeks]]
label = "Week 2"
title = "Diffusion, Foundation Models and Real-World Vision"
blurb = "Monday 19 to Friday 23 October. Diffusion and Stable Diffusion, video and vision foundation models, vision-language models and open-world recognition, then restoration, applications and 3D vision."

# -----------------------------------------------------------------------------
# Days
#
# Each day is 6 hours of contact time: two lecture blocks and two lab blocks.
# Rows marked "Optional" are extension material, not taught in the 6 hours.
# `date` is a TOML date (no quotes); it is shown on the day's card and page.
#
# Colab URLs: https://colab.research.google.com/github/<repo>/blob/main/<path>
# with the path percent-encoded (`&` is %26, `(` and `)` are %28 and %29).
# -----------------------------------------------------------------------------

